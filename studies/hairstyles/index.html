<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex"><title>Lana | Complete hairstyle tests</title>
<style>body{margin:0;background:#100c10;color:#f9e8db;text-align:center;font:16px system-ui}h1{font:italic clamp(32px,5vw,58px) Georgia;margin:.4em}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:1200px;margin:auto;gap:1px}figure{margin:0}canvas{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab}button{padding:.48em .9em;margin:.15em;color:inherit;background:#251d24;border:1px solid #8e727d}figcaption{padding:.5em}a{color:inherit}footer{padding:1.25rem}@media(max-width:680px){main{grid-template-columns:1fr;max-width:420px}}</style>
<h1>Three complete hairstyles</h1><p>Drag a model to turn all three, or compare fixed angles.</p>
<nav aria-label="Model angle"><button data-angle="0">Front</button><button data-angle="0.72">Three-quarter</button><button data-angle="1.57">Side</button><button data-angle="3.14">Back</button></nav>
<p id="status" role="status">Loading models…</p><main></main>
<footer>CC0 hairstyles from <a href="https://github.com/ffunch/vrm-avatar-maker/blob/main/ASSETS.md">MakeHuman via VRM Avatar Maker</a>. Shaggy and Curly by Cortu Johnstone.</footer>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const A='https://raw.githubusercontent.com/ffunch/vrm-avatar-maker/1435345c66da752e0e7a3b6cbae2c09bb1766c98/web/assets/';
const variants=[['cortu_shaggy_green_hair','Shaggy'],['cortu_strawberry_cloud_hair','Curly'],['faydaen_hair_1','Long, loose']];
const get=async p=>{const r=await fetch(A+p);if(!r.ok)throw Error(p+' '+r.status);return r;};
async function bytes(p){
  const b=await (await get(p)).arrayBuffer();
  if(new Uint8Array(b,0,2)[0]!==31)return b;
  return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
}
const types={f:Float32Array,I:Uint32Array};
const read=(data,[offset,count,t])=>new types[t](data,offset,count);
const main=document.querySelector('main'), status=document.querySelector('#status'), views=[];
let angle=.32;
function paint(){
  for(const v of views){v.group.rotation.y=angle;v.renderer.render(v.scene,v.cam);}
}
for(const button of document.querySelectorAll('[data-angle]'))button.addEventListener('click',()=>{angle=Number(button.dataset.angle);paint();});
function geometry(positions,indices,uv){
  const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(positions,3));
  if(uv)g.setAttribute('uv',new T.BufferAttribute(uv,2));
  g.setIndex(new T.BufferAttribute(new Uint32Array(indices),1));g.computeVertexNormals();return g;
}
function stage(label){
  const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(420,590,false);
  renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;
  const scene=new T.Scene();scene.background=new T.Color(0x0f0c10);
  const cam=new T.OrthographicCamera(-.24,.24,.337,-.337,.01,10);
  cam.position.set(0,.61,2);cam.lookAt(0,.34,0);
  const group=new T.Group();scene.add(group);
  scene.add(new T.HemisphereLight(0xffeadb,0x695c79,2.2));
  for(const [colour,power,x,y,z] of [[0xffdfc8,3,-1,2,2],[0xf7d4ff,2,1,1,-2]]){
    const l=new T.DirectionalLight(colour,power);l.position.set(x,y,z);scene.add(l);
  }
  const pedestal=new T.Mesh(new T.BoxGeometry(.23,.32,.22),new T.MeshStandardMaterial({color:0xe4ded7,roughness:.63}));
  pedestal.position.y=.16;scene.add(pedestal);
  const root=document.createElement('figure'), caption=document.createElement('figcaption');
  caption.textContent=label;root.append(renderer.domElement,caption);main.append(root);
  let x;
  renderer.domElement.addEventListener('pointerdown',e=>{x=e.clientX;renderer.domElement.setPointerCapture(e.pointerId);});
  renderer.domElement.addEventListener('pointermove',e=>{if(x===undefined)return;angle+=(e.clientX-x)*.013;x=e.clientX;paint();});
  for(const type of ['pointerup','pointercancel'])renderer.domElement.addEventListener(type,()=>{x=undefined;});
  return {renderer,scene,cam,group};
}
async function run(){
  const [base,info]=await Promise.all([bytes('base.bin.gz'),get('base.json').then(r=>r.json())]);
  const L=info.layout, rest=read(base,L.positions), bodySource=read(base,L.source), bodyIndex=read(base,L.indices);
  const p=await Promise.all(variants.map(async ([id,label])=>{
    const [b,m]=await Promise.all([bytes('items/'+id+'.bin.gz'),get('items/'+id+'.json').then(r=>r.json())]);
    const q=m.layout, refs=read(b,q.refs), weights=read(b,q.weights), offsets=read(b,q.offsets);
    const axes=['x','y','z'].map((a,k)=>m.scale[a]?Math.abs(rest[m.scale[a][0]*3+k]-rest[m.scale[a][1]*3+k])/m.scale[a][2]:1);
    const pos=new Float32Array(m.vertexCount*3);
    for(let i=0;i<m.vertexCount;i++)for(let k=0;k<3;k++){
      const j=i*3;pos[j+k]=offsets[j+k]*axes[k];
      for(let w=0;w<3;w++)pos[j+k]+=rest[refs[j+w]*3+k]*weights[j+w];
    }
    const tex=await new T.TextureLoader().loadAsync(A+'textures/'+m.texture);
    tex.colorSpace=T.SRGBColorSpace;
    const source=read(b,q.source), mapped=new Float32Array(source.length*3);
    source.forEach((i,j)=>mapped.set(pos.subarray(i*3,i*3+3),j*3));
    return {label,m,pos:mapped,uv:read(b,q.uv),indices:read(b,q.indices),tex};
  }));
  let top=-Infinity;
  for(let i=1;i<rest.length;i+=3)top=Math.max(top,rest[i]);
  const cutoff=top-2.82, centerZ=rest.filter((_,i)=>i%3===2&&rest[i-1]>top-.6);
  const zMid=(Math.min(...centerZ)+Math.max(...centerZ))/2;
  function convert(pos){
    const result=new Float32Array(pos.length);
    for(let i=0;i<pos.length;i+=3){result[i]=pos[i]/10;result[i+1]=.35+(pos[i+1]-cutoff)/10;result[i+2]=(pos[i+2]-zMid)/10;}
    return result;
  }
  const body=new Float32Array(bodySource.length*3), idx=[];
  bodySource.forEach((i,j)=>body.set(rest.subarray(i*3,i*3+3),j*3));
  for(let i=0;i<bodyIndex.length;i+=3){
    const tri=bodyIndex.subarray(i,i+3);
    if(tri.every(j=>body[j*3+1]>cutoff))idx.push(...tri);
  }
  for(const item of p){
    const v=stage(item.label+' · '+item.m.triangles.toLocaleString()+' triangles');
    v.group.add(new T.Mesh(geometry(convert(body),idx),new T.MeshStandardMaterial({color:0x211d24,roughness:.74,side:T.DoubleSide})));
    const hairMat=new T.MeshStandardMaterial({map:item.tex,alphaTest:item.m.cutout?.50:0,side:T.DoubleSide,roughness:.56});
    v.group.add(new T.Mesh(geometry(convert(item.pos),item.indices,item.uv),hairMat));views.push(v);
  }
  paint();status.textContent='Three models loaded';
}
run().catch(error=>{status.textContent='Could not render this comparison: '+error.message;console.error(error);});
</script></html>
